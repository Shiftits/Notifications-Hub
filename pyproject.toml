[project]
name = "telegram_connector"
authors = [{ name = "Your Company", email = "dev@example.com" }]
description = "Send ERPNext notifications to customers via Telegram"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = ["telethon>=1.34", "requests", "wapilot-sdk"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
